<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        black: '#0c0b0b',
                        white: '#f5f0eb',
                        cream: '#bed0f5',
                        accent: '#3262ff',
                        accent2: '#0410bb',
                        gray: '#6b6560',
                        light: '#faf7f4'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        playfair: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @media (max-width: 380px) {
            main {
                padding: 1.25rem;
            }

            main h1 {
                font-size: 1.875rem;
            }
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
</head>

<body
    class="min-h-screen flex flex-col justify-center items-center font-sans antialiased text-slate-800 bg-light p-4 sm:p-6">

    <main
        class="w-full max-w-md bg-white border border-slate-200 rounded-1.75rem p-6 sm:p-8 space-y-6 font-sans shadow-xl">
        <div class="w-full max-w-md mb-4 flex items-center justify-end text-xl">
            <a href="index.html"
                class="inline-flex items-center left-4 gap-1.5 font-bold text-slate-700 hover:text-accent transition">
                <span>X</span>
            </a>
        </div>

        <div class="text-center">
            <h1
                class="font-playfair text-3xl sm:text-4xl text-black tracking--0.08em font-black leading-none mt-1">
                Bienvenido</h1>

        </div>

        <!-- Formulario -->
        <form id="login-form" class="space-y-4 ">

            <!-- Campo Email -->
            <div class="space-y-1.5">
                <p
                class="text-sm sm:text-0.8rem text-slate-700 font-bold text-left tracking-0.12em">
                CORREO ELECTRÓNICO
            </p>
                <input type="email" id="email" required placeholder="tu@correo.com"
                    class="w-full px-4 py-3 bg-light hover:bg-white focus:bg-white border border-slate-200 focus:border-accent rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none focus:ring-4 focus:ring-accent/10 transition-all">
            </div>

            <div class="space-y-1.5">
                <p
                    class="text-sm sm:text-0.8rem text-slate-700 font-bold text-left tracking-0.12em">
                    CONTRASEÑA
                </p>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••••••"
                        class="w-full pl-4 pr-10 py-3 bg-light hover:bg-white focus:bg-white border border-slate-200 focus:border-accent rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none focus:ring-4 focus:ring-accent/10 transition-all">
                    <button type="button" onclick="alternarClave('password', 'icono-ojo')"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                        <i id="icono-ojo" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full py-3 px-4 font-extrabold text-sm rounded-xl transition-all flex items-center justify-center gap-2 group cursor-pointer uppercase tracking-wider bg-gradient-to-r from-accent2 to-black text-[#fff] rounded-lg font-semibold shadow-md shadow-accent/30 hover:shadow-lg hover:shadow-accent/40 hover:-translate-y-0.5 hover:brightness-110 transition-all duration-300">
                <span id="btn-texto">Iniciar sesión</span>
            </button>

            <div id="feedback-msg" class="hidden p-3 rounded-xl text-xs font-medium text-center"></div>

        </form>

        <div class="pt-2 text-center text-xs text-slate-500 border-t border-slate-100">
            <span>¿No tienes cuenta?</span>
            <a href="register.html" class="font-extrabold text-accent hover:underline ml-1">Regístrate gratis</a>
        </div>
        <div class="pt-2 text-center text-xs text-slate-500 border-t border-slate-100 border-t ">
            <span>O CONTINUAR CON</span>
        </div>
        <button type="button"
            class="w-full py-3 px-4  font-extrabold text-sm rounded-xl bg-gradient-to-r from-accent2 to-black text-[#fff] font-semibold shadow-md shadow-accent/30 hover:shadow-lg hover:shadow-accent/40 hover:-translate-y-0.5 hover:brightness-110 transition-all duration-300 transition-all flex items-center justify-center gap-2 group cursor-pointer uppercase tracking-wider">
            <span>GOOGLE</span>
        </button>
        <button type="button"
            class="w-full py-3 px-4  font-extrabold text-sm rounded-xl bg-gradient-to-r from-accent2 to-black text-[#fff] font-semibold shadow-md shadow-accent/30 hover:shadow-lg hover:shadow-accent/40 hover:-translate-y-0.5 hover:brightness-110 transition-all duration-300 transition-all flex items-center justify-center gap-2 group cursor-pointer uppercase tracking-wider">
            <span>FACEBOOK</span>
        </button>

    </main>
    <script>
        lucide.createIcons();

        function alternarClave(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icono = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icono.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icono.setAttribute('data-lucide', 'eye');
            }

            lucide.createIcons();
        }
    </script>

</body>

</html>
