<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        black: '#0c0b0b',
                        white: '#f5f0eb',
                        cream: '#bed0f5',
                        accent: '#3262ff',
                        accent2: '#0410bb',
                        gray: '#6b6560',
                        light: '#faf7f4'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        playfair: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
</head>

<body
    class="min-h-full flex flex-col justify-center items-center font-sans antialiased text-slate-800 bg-light p-4 sm:p-6">

    <main
        class="w-full max-w-md bg-white border border-slate-200 rounded-1.75rem p-6 sm:p-8 space-y-6 font-sans shadow-xl">
        <div class="w-full max-w-md mb-4 flex items-center justify-end text-xl">
            <a href="index.html"
                class="inline-flex items-center left-4 gap-1.5 font-bold text-slate-700 hover:text-accent transition">
                <span>X</span>
            </a>
        </div>

        <div class="text-center">
            <h1
                class="font-playfair text-4xl sm:text-3rem text-black tracking--0.08em font-black leading-none mt-1">
                Crear cuenta</h1>

        </div>

        <form id="login-form" class="space-y-4 ">
            
<div class="grid grid-cols-2 gap-4">
    <!-- NOMBRE -->
    <div class="space-y-1.5">
        <p class="text-sm text-slate-700 font-bold text-left">
            NOMBRE
        </p>
        <input type="text" id="firstname" required
            placeholder="Tu nombre"
            class="w-full px-4 py-3 bg-light hover:bg-white focus:bg-white border border-slate-200 focus:border-accent rounded-xl text-sm text-slate-800 placeholder-slate-400 outline-none transition-all">
    </div>

    <!-- APELLIDO -->
    <div class="space-y-1.5">
        <p class="text-sm text-slate-700 font-bold text-left">
            APELLIDO
        </p>
        <input type="text" id="lastname" required
            placeholder="Tu apellido"
            class="w-full px-4 py-3 bg-light hover:bg-white focus:bg-white border border-slate-200 focus:border-accent rounded-xl text-sm text-slate-800 placeholder-slate-400 outline-none transition-all">
    </div>
</div>

            <div class="space-y-1.5">
                <p
                class="text-sm sm:text-0.8rem text-slate-700 font-bold text-left tracking-0.12em">
                CORREO ELECTRÓNICO
            </p>
                <input type="email" id="email" required placeholder="tu@correo.com"
                    class="w-full px-4 py-3 bg-light hover:bg-white focus:bg-white border border-slate-200 focus:border-accent rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none focus:ring-4 focus:ring-accent/10 transition-all">
            </div>

            <div class="space-y-1.5">
                <p
                    class="text-sm sm:text-0.8rem text-slate-700 font-bold text-left tracking-0.12em">
                    CONTRASEÑA
                </p>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••••••"
                        class="w-full pr-10 pl-4 py-3 bg-light hover:bg-white focus:bg-white border border-slate-200 focus:border-accent rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none focus:ring-4 focus:ring-accent/10 transition-all">
                    <button type="button" onclick="alternarClave('password', 'icono-ojo')"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                        <i id="icono-ojo" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <div class="space-y-1.5">
                <p
                    class="text-sm sm:text-0.8rem text-slate-700 font-bold text-left tracking-0.12em">
                    CONFIRMAR CONTRASEÑA
                </p>
                <div class="relative">
                    <input type="password" id="confirm-password" required placeholder="••••••••••••"
                        class="w-full pr-10 pl-4 py-3 bg-light hover:bg-white focus:bg-white border border-slate-200 focus:border-accent rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none focus:ring-4 focus:ring-accent/10 transition-all">
                    <button type="button" onclick="alternarClave('confirm-password', 'icono-ojo-confirmar')"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                        <i id="icono-ojo-confirmar" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full py-3 px-4 bg-black hover:bg-accent  text-white font-extrabold text-sm rounded-xl shadow-md shadow-accent/20 hover:shadow-lg transition-all flex items-center justify-center gap-2 group cursor-pointer uppercase tracking-wider">
                <span id="btn-texto">CREAR CUENTA</span>
            </button>

            <div id="feedback-msg" class="hidden p-3 rounded-xl text-xs font-medium text-center"></div>

        </form>

        <div class="pt-2 text-center text-xs text-slate-500 border-t border-slate-100">
            <span>¿ya tienes cuenta?</span>
            <a href="login.html" class="font-extrabold text-accent hover:underline ml-1">Inicia sesión</a>
        </div>

    </main>

    <script>
        lucide.createIcons();

        function alternarClave(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icono = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icono.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icono.setAttribute('data-lucide', 'eye');
            }

            lucide.createIcons();
        }
    </script>

</body>

</html>
